     Preverjevalnik kletvic
     Verzija: 1.1
     Datum: 14.10.2026
     Spremembe:
       - Dodano diagnostično polje z gumbi Počisti in Kopiraj
       - Beleženje vseh pomembnih dogodkov (zagon, napake, zaznave)
       - Prikaz napak SpeechRecognition v realnem času
     ============================================ -->
<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Preverjevalnik kletvic v1.1</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, Roboto, sans-serif;
    margin: 0; padding: 16px;
    background: #111; color: #eee;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 20px; margin: 8px 0 4px; text-align: center; }
  #verzija { font-size: 12px; color: #666; margin-bottom: 16px; }

  #vu-ovoj {
    width: 100%; max-width: 500px;
    height: 28px; background: #222;
    border-radius: 14px; overflow: hidden;
    margin-bottom: 12px; position: relative;
  }
  #vu-vrstica {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2ecc71 0%, #f1c40f 60%, #e74c3c 100%);
    transition: width 0.05s linear;
  }
  #vu-oznaka {
    position: absolute; top: 4px; left: 12px;
    font-size: 13px; color: #fff;
    text-shadow: 0 0 3px #000; font-weight: bold;
  }

  .nastavitve {
    width: 100%; max-width: 500px;
    background: #1a1a1a; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 16px; font-size: 14px;
  }
  .vrstica {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .vrstica:last-child { margin-bottom: 0; }
  .vrstica label { flex: 1; }
  .vrstica input[type="range"] { flex: 1.2; margin: 0 10px; }
  .vrstica .vrednost {
    min-width: 60px; text-align: right;
    color: #2ecc71; font-weight: bold;
  }

  #gumb {
    font-size: 20px; font-weight: bold;
    padding: 18px 40px; border: none; border-radius: 50px;
    background: #2ecc71; color: #fff; cursor: pointer;
    width: 100%; max-width: 320px; transition: background 0.2s;
  }
  #gumb.aktivno { background: #e74c3c; }
  #gumb:disabled { background: #555; }

  #stevec { font-size: 15px; color: #888; margin: 14px 0; min-height: 22px; }
  #rezultat {
    margin-top: 12px; padding: 14px; border-radius: 12px;
    width: 100%; max-width: 500px; min-height: 60px;
    font-size: 15px; line-height: 1.5; word-break: break-word;
  }
  .varno { background: #1a3a1a; color: #7ee87e; }
  .slabo { background: #3a1a1a; color: #ff7e7e; font-weight: bold; }
  .najdeno { background: #ff4444; color: #fff; padding: 0 4px; border-radius: 4px; }
  .premajhen { background: #2a2a1a; color: #d4b34a; }

  #zgodovina {
    margin-top: 24px; width: 100%; max-width: 500px;
    font-size: 14px; color: #aaa;
  }
  #zgodovina h2 { font-size: 16px; color: #ccc; margin-bottom: 6px; }
  .zapis { padding: 6px 0; border-bottom: 1px solid #333; }
  #pocistiZgodovino {
    margin-top: 10px; padding: 8px 16px;
    background: #333; color: #ccc; border: none;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }

  /* ---- Diagnostično polje ---- */
  #diagnostika {
    margin-top: 24px;
    width: 100%; max-width: 500px;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 12px;
  }
  #diagnostika h2 {
    font-size: 15px; color: #ccc;
    margin: 0 0 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #gumbiDiag { display: flex; gap: 8px; }
  #gumbiDiag button {
    padding: 6px 12px;
    background: #2a2a2a; color: #ddd;
    border: 1px solid #444; border-radius: 6px;
    cursor: pointer; font-size: 12px;
  }
  #gumbiDiag button:active { background: #3a3a3a; }
  #logVsebina {
    font-family: monospace;
    font-size: 11px;
    line-height: 1.5;
    color: #9e9e9e;
    background: #000;
    border-radius: 6px;
    padding: 8px;
    max-height: 240px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .log-info { color: #9e9e9e; }
  .log-ok { color: #7ee87e; }
  .log-warn { color: #f1c40f; }
  .log-err { color: #ff7e7e; }
  .log-cas { color: #555; }
</style>
</head>
<body>

<h1>🎤 Preverjevalnik kletvic</h1>
<div id="verzija">Verzija 1.1</div>

<div id="vu-ovoj">
  <div id="vu-vrstica"></div>
  <div id="vu-oznaka">– dB</div>
</div>

<div class="nastavitve">
  <div class="vrstica">
    <label>Interval analize</label>
    <input type="range" id="nastavitveInterval" min="3" max="30" step="1" value="10">
    <span class="vrednost" id="vrednostInterval">10 s</span>
  </div>
  <div class="vrstica">
    <label>Prag glasnosti (VU)</label>
    <input type="range" id="nastavitvePrag" min="-80" max="-10" step="1" value="-45">
    <span class="vrednost" id="vrednostPrag">-45 dB</span>
  </div>
  <div class="vrstica">
    <label>Min. dolžina besedila</label>
    <input type="range" id="nastavitveDolzina" min="1" max="20" step="1" value="3">
    <span class="vrednost" id="vrednostDolzina">3 znaki</span>
  </div>
</div>

<button id="gumb">Začni poslušati</button>
<div id="stevec"></div>
<div id="rezultat">Pritisnite gumb in govorite...</div>

<div id="zgodovina">
  <h2>Zgodovina zaznav <span id="skupaj" style="color:#e74c3c;"></span></h2>
  <div id="seznam">Ni še zaznav.</div>
  <button id="pocistiZgodovino">Počisti zgodovino</button>
</div>

<!-- Diagnostično polje -->
<div id="diagnostika">
  <h2>
    Diagnostika
    <div id="gumbiDiag">
      <button id="btnKopiraj">📋 Kopiraj</button>
      <button id="btnPocistiLog">🗑 Počisti</button>
    </div>
  </h2>
  <div id="logVsebina"></div>
</div>

<script>
// ---- Kletvice ----
const kletvice = ["kurba", "jebem", "jebi", "pička", "kurac", "sranje", "prasica", "fak", "shit", "fuck"];

// ---- Elementi ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const gumb = document.getElementById("gumb");
const stevec = document.getElementById("stevec");
const izhod = document.getElementById("rezultat");
const vuVrstica = document.getElementById("vu-vrstica");
const vuOznaka = document.getElementById("vu-oznaka");
const seznam = document.getElementById("seznam");
const skupajEl = document.getElementById("skupaj");
const logVsebina = document.getElementById("logVsebina");

const sInterval = document.getElementById("nastavitveInterval");
const sPrag = document.getElementById("nastavitvePrag");
const sDolzina = document.getElementById("nastavitveDolzina");
const vInterval = document.getElementById("vrednostInterval");
const vPrag = document.getElementById("vrednostPrag");
const vDolzina = document.getElementById("vrednostDolzina");
const btnPocisti = document.getElementById("pocistiZgodovino");
const btnKopiraj = document.getElementById("btnKopiraj");
const btnPocistiLog = document.getElementById("btnPocistiLog");

// ---- Log ----
function log(sporocilo, tip = "info") {
  const zdaj = new Date();
  const cas = zdaj.toLocaleTimeString("sl-SI") + "." + String(zdaj.getMilliseconds()).padStart(3, "0");
  const vrstica = document.createElement("div");
  vrstica.className = "log-" + tip;
  vrstica.innerHTML = `<span class="log-cas">[${cas}]</span> ${sporocilo}`;
  logVsebina.appendChild(vrstica);
  logVsebina.scrollTop = logVsebina.scrollHeight;

  // Omeji na 300 vrstic
  while (logVsebina.childElementCount > 300) {
    logVsebina.removeChild(logVsebina.firstChild);
  }
}

btnPocistiLog.onclick = () => {
  logVsebina.innerHTML = "";
  log("Diagnostični dnevnik počiščen.", "info");
};

btnKopiraj.onclick = async () => {
  const besedilo = logVsebina.innerText;
  try {
    await navigator.clipboard.writeText(besedilo);
    log("Dnevnik kopiran v odložišče.", "ok");
  } catch (e) {
    // Rezervna metoda
    const ta = document.createElement("textarea");
    ta.value = besedilo;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    log("Dnevnik kopiran (rezervna metoda).", "ok");
  }
};

// ---- localStorage ----
function shrani(kljuc, vrednost) {
  try { localStorage.setItem(kljuc, JSON.stringify(vrednost)); } catch (e) {}
}
function nalozi(kljuc, privzeto) {
  try {
    const v = localStorage.getItem(kljuc);
    return v === null ? privzeto : JSON.parse(v);
  } catch (e) { return privzeto; }
}

// ---- Naloži ----
let intervalSek = nalozi("pk_interval", 10);
let pragDb = nalozi("pk_prag", -45);
let minDolzina = nalozi("pk_dolzina", 3);
let zgodovina = nalozi("pk_zgodovina", []);
let skupajKletvic = nalozi("pk_skupaj", 0);

sInterval.value = intervalSek;
sPrag.value = pragDb;
sDolzina.value = minDolzina;
vInterval.textContent = intervalSek + " s";
vPrag.textContent = pragDb + " dB";
vDolzina.textContent = minDolzina + " znakov";

// ---- Ob spremembi ----
sInterval.oninput = () => {
  intervalSek = parseInt(sInterval.value);
  vInterval.textContent = intervalSek + " s";
  shrani("pk_interval", intervalSek);
  log(`Interval analize: ${intervalSek} s`, "info");
};
sPrag.oninput = () => {
  pragDb = parseInt(sPrag.value);
  vPrag.textContent = pragDb + " dB";
  shrani("pk_prag", pragDb);
  log(`Prag glasnosti: ${pragDb} dB`, "info");
};
sDolzina.oninput = () => {
  minDolzina = parseInt(sDolzina.value);
  vDolzina.textContent = minDolzina + " znakov";
  shrani("pk_dolzina", minDolzina);
  log(`Min. dolžina besedila: ${minDolzina} znakov`, "info");
};

// ---- Stanje ----
let poslusa = false;
let buffer = "";
let intervalId = null;
let preostalo = intervalSek;
let recognition = null;
let audioCtx = null;
let analyser = null;
let mikrofonStream = null;
let vuAnim = null;
let trenutnaDb = -100;
let stZagonovRec = 0;

// ---- Sirena ----
function sirena() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  gain.gain.value = 0.7;
  const toni = [880, 440, 880, 440, 880, 440];
  let cas = ctx.currentTime;
  toni.forEach((f) => {
    const osc = ctx.createOscillator();
    osc.type = "square";
    osc.frequency.value = f;
    osc.connect(gain);
    osc.start(cas);
    osc.stop(cas + 0.25);
    cas += 0.25;
  });
  setTimeout(() => ctx.close(), 2000);
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  log("🔊 Sirena sprožena", "warn");
}

// ---- VU ----
async function zazeniVU() {
  try {
    mikrofonStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const vir = audioCtx.createMediaStreamSource(mikrofonStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    vir.connect(analyser);

    const podatki = new Uint8Array(analyser.fftSize);
    const loop = () => {
      analyser.getByteTimeDomainData(podatki);
      let vsota = 0;
      for (let i = 0; i < podatki.length; i++) {
        const v = (podatki[i] - 128) / 128;
        vsota += v * v;
      }
      const rms = Math.sqrt(vsota / podatki.length);
      const db = 20 * Math.log10(rms || 0.000001);
      trenutnaDb = db;

      const odstotek = Math.max(0, Math.min(100, ((db + 80) / 80) * 100));
      vuVrstica.style.width = odstotek + "%";
      vuOznaka.textContent = db.toFixed(0) + " dB";

      if (db >= pragDb) vuOznaka.style.color = "#2ecc71";
      else vuOznaka.style.color = "#fff";

      vuAnim = requestAnimationFrame(loop);
    };
    loop();
    log("VU meter zagnan", "ok");
  } catch (e) {
    log("VU meter napaka: " + e.message, "err");
  }
}

function ustaviVU() {
  if (vuAnim) cancelAnimationFrame(vuAnim);
  vuAnim = null;
  if (mikrofonStream) mikrofonStream.getTracks().forEach(t => t.stop());
  mikrofonStream = null;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  analyser = null;
  vuVrstica.style.width = "0%";
  vuOznaka.textContent = "– dB";
  log("VU meter ustavljen", "info");
}

// ---- Zgodovina ----
function osveziZgodovino() {
  if (zgodovina.length === 0) {
    seznam.textContent = "Ni še zaznav.";
  } else {
    seznam.innerHTML = zgodovina.slice(0, 20).map(z =>
      `<div class="zapis">${z.cas} – <strong style="color:#ff7e7e;">${z.besede}</strong></div>`
    ).join("");
  }
  skupajEl.textContent = skupajKletvic > 0 ? `(skupaj: ${skupajKletvic})` : "";
}

btnPocisti.onclick = () => {
  if (confirm("Res želite počistiti vso zgodovino in statistiko?")) {
    zgodovina = [];
    skupajKletvic = 0;
    shrani("pk_zgodovina", zgodovina);
    shrani("pk_skupaj", skupajKletvic);
    osveziZgodovino();
    log("Zgodovina počiščena", "warn");
  }
};

// ---- Analiza ----
function analiziraj() {
  const besedilo = buffer.trim();
  buffer = "";

  log(`Analiza – buffer: "${besedilo}" (${besedilo.length} znakov, trenutno ${trenutnaDb.toFixed(0)} dB)`, "info");

  if (trenutnaDb < pragDb && !besedilo) {
    izhod.className = "premajhen";
    izhod.textContent = `🔇 Prešibek signal (${trenutnaDb.toFixed(0)} dB < ${pragDb} dB) – analiza preskočena.`;
    log(`Preskočeno: prešibek signal in prazen buffer`, "warn");
    return;
  }

  if (!besedilo) {
    izhod.className = "varno";
    izhod.textContent = `✅ V zadnjih ${intervalSek} s ni bilo zaznanega govora.`;
    log(`Preskočeno: prazen buffer`, "warn");
    return;
  }

  if (besedilo.length < minDolzina) {
    izhod.className = "premajhen";
    izhod.textContent = `✋ Prekratko besedilo (${besedilo.length} < ${minDolzina} znakov) – analiza preskočena.`;
    log(`Preskočeno: prekratko besedilo`, "warn");
    return;
  }

  const ocisceno = besedilo.toLowerCase();
  const najdene = kletvice.filter(k => {
    const re = new RegExp(`\\b${k}\\b`, "i");
    return re.test(ocisceno);
  });

  if (najdene.length > 0) {
    let oznacevalnik = besedilo;
    najdene.forEach(k => {
      const re = new RegExp(`\\b${k}\\b`, "gi");
      oznacevalnik = oznacevalnik.replace(re, m => `<span class="najdeno">${m}</span>`);
    });
    izhod.className = "slabo";
    izhod.innerHTML = `⚠️ Zaznana kletvica: <strong>${najdene.join(", ")}</strong><br><small>${oznacevalnik}</small>`;
    log(`⚠️ NAJDENO: ${najdene.join(", ")}`, "err");
    sirena();

    zgodovina.unshift({
      cas: new Date().toLocaleString("sl-SI"),
      besede: najdene.join(", ")
    });
    if (zgodovina.length > 50) zgodovina.pop();
    skupajKletvic += najdene.length;

    shrani("pk_zgodovina", zgodovina);
    shrani("pk_skupaj", skupajKletvic);
    osveziZgodovino();
  } else {
    izhod.className = "varno";
    izhod.textContent = `✅ V redu. Prepoznano: ${besedilo}`;
    log(`V redu, brez kletvic`, "ok");
  }
}

// ---- Zagon ----
gumb.onclick = async () => {
  log("=== Klik na gumb ===", "info");

  if (!SpeechRecognition) {
    izhod.className = "slabo";
    izhod.textContent = "Brskalnik ne podpira prepoznave govora.";
    log("NAPAKA: SpeechRecognition ni podprt", "err");
    return;
  }

  if (!poslusa) {
    log("Zahtevam dovoljenje za mikrofon...", "info");
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true });
      log("Dovoljenje za mikrofon odobreno", "ok");
    } catch (e) {
      izhod.className = "slabo";
      izhod.textContent = "Dostop do mikrofona je zavrnjen.";
      log("NAPAKA: dovoljenje zavrnjeno – " + e.message, "err");
      return;
    }

    await zazeniVU();

    stZagonovRec = 0;
    zagonRecognition();

    buffer = "";
    preostalo = intervalSek;
    poslusa = true;
    gumb.textContent = "Ustavi";
    gumb.classList.add("aktivno");
    izhod.className = "";
    izhod.textContent = "Poslušam...";
    stevec.textContent = `Naslednja analiza čez ${preostalo} s...`;

    intervalId = setInterval(() => {
      preostalo--;
      if (preostalo <= 0) {
        analiziraj();
        preostalo = intervalSek;
      }
      stevec.textContent = `Naslednja analiza čez ${preostalo} s...`;
    }, 1000);

  } else {
    log("Ustavljam...", "info");
    poslusa = false;
    if (recognition) recognition.stop();
    clearInterval(intervalId);
    intervalId = null;
    ustaviVU();
    gumb.textContent = "Začni poslušati";
    gumb.classList.remove("aktivno");
    stevec.textContent = "";
  }
};

function zagonRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang = "sl-SI";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = () => {
    stZagonovRec++;
    log(`SpeechRecognition zagnan (#${stZagonovRec}, jezik: ${recognition.lang})`, "ok");
  };

  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        const t = event.results[i][0].transcript;
        buffer += " " + t;
        log(`Prepoznano: "${t}"`, "ok");
      } else {
        log(`Vmesno: "${event.results[i][0].transcript}"`, "info");
      }
    }
  };

  recognition.onerror = (e) => {
    log(`NAPAKA SpeechRecognition: ${e.error}${e.message ? " – " + e.message : ""}`, "err");
    if (e.error === "not-allowed") {
      izhod.className = "slabo";
      izhod.textContent = "Mikrofon zavrnjen med sejo.";
    } else if (e.error === "no-speech") {
      // tiho
    } else if (e.error === "network") {
      izhod.className = "slabo";
      izhod.textContent = "Omrežna napaka – Chrome potrebuje internet za prepoznavo.";
    }
  };

  recognition.onend = () => {
    log("SpeechRecognition se je zaključil", "warn");
    if (poslusa) {
      setTimeout(() => {
        if (poslusa) {
          try { recognition.start(); }
          catch (e) { log("Napaka pri ponovnem zagonu: " + e.message, "err"); }
        }
      }, 250);
    }
  };

  try {
    recognition.start();
  } catch (e) {
    log("Napaka pri zagonu: " + e.message, "err");
  }
}

window.addEventListener("beforeunload", () => {
  if (recognition) recognition.stop();
  ustaviVU();
});

// ---- Inicializacija ----
osveziZgodovino();
log("=== Aplikacija naložena ===", "ok");
log(`Verzija 1.1 | SpeechRecognition: ${SpeechRecognition ? "podprt" : "NI podprt"}`, "info");
log(`Jezik: sl-SI | Interval: ${intervalSek}s | Prag: ${pragDb}dB | Min: ${minDolzina}`, "info");
if (!SpeechRecognition) log("OPOZORILO: brskalnik ne podpira prepoznave govora", "err");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>Glasovni preverjevalnik kletvic (5 s interval)</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  button { font-size: 18px; padding: 12px 24px; cursor: pointer; }
  #rezultat { margin-top: 20px; padding: 12px; border-radius: 8px; min-height: 40px; }
  .varno { background: #e6f7e6; color: #1a7a1a; }
  .slabo { background: #ffe6e6; color: #b30000; font-weight: bold; }
  #stevec { font-size: 14px; color: #666; margin-top: 8px; }
</style>
</head>
<body>

<h1>Glasovni preverjevalnik kletvic</h1>
<button id="gumb">Začni poslušati</button>
<div id="rezultat">Pritisnite gumb in govorite...</div>
<div id="stevec"></div>

<script>
const kletvice = ["kurba", "jebem", "jebi", "pička", "kurac", "sranje", "prasica", "fak", "shit", "fuck"];

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  document.getElementById("rezultat").textContent = "Vaš brskalnik ne podpira prepoznavanja govora.";
  document.getElementById("gumb").disabled = true;
}

const recognition = new SpeechRecognition();
recognition.lang = "sl-SI";
recognition.continuous = true;
recognition.interimResults = false; // pomembno: samo končni rezultati

const gumb = document.getElementById("gumb");
const izhod = document.getElementById("rezultat");
const stevec = document.getElementById("stevec");

let poslusa = false;
let buffer = "";       // zbrano besedilo v trenutnem 5-sekundnem oknu
let intervalId = null; // ID intervala

// ---- Sirena ----
function sirena() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  gain.gain.value = 0.6;

  const toni = [880, 440, 880, 440, 880, 440];
  let cas = ctx.currentTime;

  toni.forEach((f) => {
    const osc = ctx.createOscillator();
    osc.type = "square";
    osc.frequency.value = f;
    osc.connect(gain);
    osc.start(cas);
    osc.stop(cas + 0.25);
    cas += 0.25;
  });

  setTimeout(() => ctx.close(), 2000);
}

// ---- Analiza bufferja ----
function analiziraj() {
  const besedilo = buffer.trim();
  buffer = ""; // izprazni buffer za naslednje okno

  if (!besedilo) {
    izhod.className = "varno";
    izhod.textContent = "✅ V zadnjih 5 sekundah ni bilo govora.";
    return;
  }

  const ocisceno = besedilo.toLowerCase();

  const najdene = kletvice.filter(k => {
    const re = new RegExp(`\\b${k}\\b`, "i");
    return re.test(ocisceno);
  });

  if (najdene.length > 0) {
    izhod.className = "slabo";
    izhod.innerHTML = `⚠️ Zaznana kletvica: <strong>${najdene.join(", ")}</strong><br><small>Prepoznano: ${besedilo}</small>`;
    sirena();
  } else {
    izhod.className = "varno";
    izhod.textContent = `✅ V redu. Prepoznano: ${besedilo}`;
  }
}

// ---- Zagon / ustavitev ----
gumb.onclick = () => {
  if (!poslusa) {
    buffer = "";
    recognition.start();
    poslusa = true;
    gumb.textContent = "Ustavi";

    // Vsakih 5 sekund analiziraj
    let preostalo = 5;
    stevec.textContent = `Naslednja analiza čez ${preostalo} s...`;
    intervalId = setInterval(() => {
      preostalo--;
      if (preostalo <= 0) {
        analiziraj();
        preostalo = 5;
      }
      stevec.textContent = `Naslednja analiza čez ${preostalo} s...`;
    }, 1000);

    izhod.textContent = "Poslušam...";
    izhod.className = "";
  } else {
    recognition.stop();
    clearInterval(intervalId);
    intervalId = null;
    poslusa = false;
    gumb.textContent = "Začni poslušati";
    stevec.textContent = "";
  }
};

// ---- Zbiranje rezultatov ----
recognition.onresult = (event) => {
  for (let i = event.resultIndex; i < event.results.length; i++) {
    if (event.results[i].isFinal) {
      buffer += " " + event.results[i][0].transcript;
    }
  }
};

recognition.onerror = (event) => {
  if (event.error === "not-allowed") {
    izhod.textContent = "Dostop do mikrofona je zavrnjen.";
  } else {
    izhod.textContent = `Napaka: ${event.error}`;
  }
};

recognition.onend = () => {
  if (poslusa) recognition.start(); // samodejno nadaljuj
};
</script>

</body>
</html>
